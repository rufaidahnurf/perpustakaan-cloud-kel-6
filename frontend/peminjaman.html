<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Peminjaman Buku | Sistem Informasi Perpustakaan</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tom Select -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-book-half"></i>
            <h4>Perpustakaan</h4>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="buku.html">
                    <i class="bi bi-book-fill"></i>
                    <span>Buku</span>
                </a>
            </li>

            <li>
                <a href="anggota.html">
                    <i class="bi bi-people-fill"></i>
                    <span>Anggota</span>
                </a>
            </li>

            <li class="active">
                <a href="peminjaman.html">
                    <i class="bi bi-journal-bookmark-fill"></i>
                    <span>Peminjaman</span>
                </a>
            </li>

            <li>
                <a href="laporan.html">
                    <i class="bi bi-file-earmark-text-fill"></i>
                    <span>Laporan</span>
                </a>
            </li>

        </ul>

        <div class="logout">
            <a href="login.html">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div class="topbar d-flex justify-content-between align-items-center mb-4">

            <div>

                <h3 class="fw-bold mb-1">
                    📖 Peminjaman Buku
                </h3>

                <small class="text-muted">
                    Kelola transaksi peminjaman buku
                </small>

            </div>

            <button class="btn btn-warning text-white"
                data-bs-toggle="modal"
                data-bs-target="#modalPeminjaman">

                <i class="bi bi-plus-circle"></i>
                Tambah Peminjaman

            </button>

        </div>

        <!-- SEARCH -->
        <div class="card mb-4">

            <div class="card-body">

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="searchPeminjaman"
                        class="form-control"
                        placeholder="Cari anggota atau buku...">

                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="card">

            <div class="card-header d-flex justify-content-between align-items-center">

                <strong>Riwayat Peminjaman</strong>

            </div>

            <div class="card-body table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Anggota</th>
                            <th>Buku</th>
                            <th>Pinjam</th>
                            <th>Kembali</th>
                            <th>Status</th>
                            <th>Aksi</th>
                            <th>Return</th>

                        </tr>

                    </thead>

                    <tbody id="dataPeminjaman">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<!-- ======================= -->
<!-- MODAL PEMINJAMAN -->
<!-- ======================= -->
<div class="modal fade" id="modalPeminjaman" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Form Peminjaman
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <form id="formPeminjaman">

                    <div class="mb-3">

                        <label>Anggota</label>
                        <select id="anggota" class="form-select"></select>

                    </div>

                    <div class="mb-3">

                        <label>Buku</label>
                        <select id="buku" class="form-select"></select>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label>Tanggal Pinjam</label>
                            <input type="date" id="tanggal_pinjam" class="form-control">

                        </div>

                        <div class="col-md-6">

                            <label>Tanggal Kembali</label>
                            <input type="date" id="tanggal_kembali" class="form-control">

                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Batal
                </button>

                <button class="btn btn-warning text-white" form="formPeminjaman">
                    Simpan
                </button>

            </div>

        </div>

    </div>

</div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/peminjaman.js"></script>

</body>
</html>
