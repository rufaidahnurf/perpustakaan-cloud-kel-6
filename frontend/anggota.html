<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <title>Data Anggota | Sistem Informasi Perpustakaan</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-book-half"></i>
            <h4>Perpustakaan</h4>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="buku.html">
                    <i class="bi bi-book-fill"></i>
                    <span>Buku</span>
                </a>
            </li>

            <li class="active">
                <a href="anggota.html">
                    <i class="bi bi-people-fill"></i>
                    <span>Anggota</span>
                </a>
            </li>

            <li>
                <a href="peminjaman.html">
                    <i class="bi bi-journal-bookmark-fill"></i>
                    <span>Peminjaman</span>
                </a>
            </li>

            <li>
                <a href="laporan.html">
                    <i class="bi bi-file-earmark-text-fill"></i>
                    <span>Laporan</span>
                </a>
            </li>

        </ul>

        <div class="logout">
            <a href="login.html">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <!-- Main -->
    <main class="main-content">

        <!-- Topbar -->
        <div class="topbar d-flex justify-content-between align-items-center mb-4">

            <div>

                <h3 class="fw-bold mb-1">
                    👤 Data Anggota
                </h3>

                <small class="text-muted">
                    Kelola seluruh anggota perpustakaan
                </small>

            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalAnggota"
                onclick="resetForm()">

                <i class="bi bi-plus-circle"></i>
                Anggota Baru

            </button>

        </div>

        <!-- Search -->
        <div class="card mb-4">

            <div class="card-body">

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="searchAnggota"
                        class="form-control"
                        placeholder="Cari nama anggota...">

                </div>

            </div>

        </div>

        <!-- Table -->
        <div class="card">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    <i class="bi bi-people-fill text-primary"></i>
                    Daftar Anggota
                </h5>

                <span class="badge bg-primary" id="jumlahAnggota">
                    0 Anggota
                </span>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover table-borderless align-middle">

                        <thead>

                            <tr>
                                <th width="80">ID</th>
                                <th>Nama</th>
                                <th width="180">Aksi</th>
                            </tr>

                        </thead>

                        <tbody id="dataAnggota">

                            <tr>

                                <td colspan="3" class="text-center p-5">

                                    <div class="spinner-border text-primary"></div>

                                    <br>

                                    Loading...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Modal -->
        <div class="modal fade" id="modalAnggota" tabindex="-1">

            <div class="modal-dialog">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            <i class="bi bi-person-plus-fill text-primary"></i>
                            Form Anggota
                        </h5>

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                        </button>

                    </div>

                    <div class="modal-body">

                        <form id="formAnggota">

                            <div class="mb-3">

                                <label class="form-label">
                                    Nama Anggota
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input
                                        type="text"
                                        id="nama"
                                        class="form-control"
                                        placeholder="Masukkan nama anggota"
                                        required>

                                </div>

                            </div>

                        </form>

                    </div>

                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal">

                            Batal

                        </button>

                        <button
                            type="submit"
                            form="formAnggota"
                            class="btn btn-primary"
                            id="btnSimpan">

                            <i class="bi bi-save-fill"></i>
                            Simpan

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <footer class="text-center mt-5 mb-3 text-muted">

            <i class="bi bi-book-half"></i>

            Sistem Informasi Perpustakaan © 2026

        </footer>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/anggota.js"></script>

</body>

</html>
