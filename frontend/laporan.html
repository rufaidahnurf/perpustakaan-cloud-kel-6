<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan | Sistem Informasi Perpustakaan</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <i class="bi bi-book-half"></i>
            <h4>Perpustakaan</h4>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li>
                <a href="buku.html">
                    <i class="bi bi-book-fill"></i>
                    <span>Buku</span>
                </a>
            </li>

            <li>
                <a href="anggota.html">
                    <i class="bi bi-people-fill"></i>
                    <span>Anggota</span>
                </a>
            </li>

            <li>
                <a href="peminjaman.html">
                    <i class="bi bi-journal-bookmark-fill"></i>
                    <span>Peminjaman</span>
                </a>
            </li>

            <li class="active">
                <a href="laporan.html">
                    <i class="bi bi-file-earmark-text-fill"></i>
                    <span>Laporan</span>
                </a>
            </li>

        </ul>

        <div class="logout">
            <a href="login.html">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- TOPBAR -->
        <div class="topbar d-flex justify-content-between align-items-center mb-4">

            <div>

                <h3 class="fw-bold mb-1">
                    📄 Laporan Peminjaman
                </h3>

                <small class="text-muted">
                    Cetak dan filter laporan peminjaman buku
                </small>

            </div>

            <button class="btn btn-success" onclick="window.print()">
                <i class="bi bi-printer-fill"></i>
                Cetak
            </button>

        </div>

        <!-- FILTER -->
        <div class="card mb-4">

            <div class="card-header d-flex align-items-center gap-2">

                <i class="bi bi-funnel-fill text-danger"></i>

                <strong>Filter Laporan</strong>

            </div>

            <div class="card-body">

                <div class="row g-3">

                    <div class="col-md-5">

                        <label class="form-label">Tanggal Awal</label>

                        <input type="date" id="dari" class="form-control">

                    </div>

                    <div class="col-md-5">

                        <label class="form-label">Tanggal Akhir</label>

                        <input type="date" id="sampai" class="form-control">

                    </div>

                    <div class="col-md-2 d-flex align-items-end">

                        <button class="btn btn-primary w-100" id="btnFilter">

                            <i class="bi bi-search"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="card">

            <div class="card-header d-flex justify-content-between align-items-center">

                <div class="d-flex align-items-center gap-2">

                    <i class="bi bi-table text-danger"></i>

                    <strong>Data Laporan</strong>

                </div>

                <span class="badge bg-danger" id="totalLaporan">
                    0 Data
                </span>

            </div>

            <div class="card-body table-responsive">

                <table class="table table-hover table-borderless align-middle">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Anggota</th>
                            <th>Buku</th>
                            <th>Tanggal Pinjam</th>
                            <th>Tanggal Kembali</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="dataLaporan">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script src="js/laporan.js"></script>

</body>
</html>
